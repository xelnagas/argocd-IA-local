apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-mcp-search-code
  namespace: jarvis-system
  labels:
    app.kubernetes.io/name: mcp-search
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: jarvis
data:
  server.py: |
    import asyncio
    import json
    import urllib.request
    from bs4 import BeautifulSoup
    from ddgs import DDGS
    from mcp.server.fastmcp import FastMCP
    import uvicorn

    mcp = FastMCP("JarvisWebSearch", host="0.0.0.0", port=8000)

    @mcp.tool(
        name="search_internet",
        description="Recherche sur Internet en temps réel via DuckDuckGo. Utilise cet outil dès que l'utilisateur pose une question sur l'actualité, la météo, des versions récentes de logiciels ou tout sujet nécessitant des informations récentes ou externes."
    )
    def search_internet(query: str, max_results: int = 5) -> str:
        """Recherche des informations sur Internet en temps réel.
        
        Args:
            query: Requête ou mots-clés de recherche.
            max_results: Nombre maximum de résultats (défaut: 5).
        """
        try:
            results = []
            with DDGS() as ddgs:
                for i, r in enumerate(ddgs.text(query, max_results=max_results), 1):
                    results.append(
                        f"[{i}] {r.get('title')}\n"
                        f"URL: {r.get('href')}\n"
                        f"Extrait: {r.get('body')}\n"
                    )
            if not results:
                return f"Aucun résultat trouvé pour '{query}'."
            return "\n---\n".join(results)
        except Exception as e:
            return f"Erreur lors de la recherche sur Internet : {str(e)}"

    @mcp.tool(
        name="fetch_web_page",
        description="Télécharge et lit le contenu complet d'une page Web à partir de son URL. Utilise cet outil pour approfondir un article ou un lien trouvé lors d'une recherche."
    )
    def fetch_web_page(url: str, max_chars: int = 3000) -> str:
        """Télécharge et extrait le texte d'une page web.
        
        Args:
            url: L'adresse URL complète de la page web.
            max_chars: Nombre maximum de caractères à extraire (défaut: 3000).
        """
        try:
            req = urllib.request.Request(
                url,
                headers={
                    "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                }
            )
            with urllib.request.urlopen(req, timeout=10) as response:
                html = response.read().decode("utf-8", errors="ignore")
                soup = BeautifulSoup(html, "html.parser")
                for tag in soup(["script", "style", "nav", "footer", "header", "aside", "noscript"]):
                    tag.decompose()
                clean_text = " ".join(soup.get_text().split())
                if len(clean_text) > max_chars:
                    clean_text = clean_text[:max_chars] + "... [Contenu tronqué]"
                return clean_text
        except Exception as e:
            return f"Erreur lors de la récupération de la page '{url}' : {str(e)}"

    @mcp.tool(
        name="generate_image",
        description="Génère une image ou photographie réaliste en haute résolution via le Studio Visuel GPU local. Utilise cet outil dès que l'utilisateur demande d'imaginer, dessiner, générer ou créer une photo ou image."
    )
    def generate_image(prompt: str, aspect_ratio: str = "1:1") -> str:
        """Génère une image photoréaliste via le Studio Visuel GPU local.
        
        Args:
            prompt: Description photographique détaillée en anglais (cadrage, lumière, sujet, style 85mm raw photo).
            aspect_ratio: Ratio d'aspect de l'image ("1:1", "16:9", "9:16", "4:3", "3:4").
        """
        try:
            req_data = json.dumps({"prompt": prompt, "aspect_ratio": aspect_ratio}).encode("utf-8")
            req = urllib.request.Request(
                "http://jarvis-image-gen.jarvis-system.svc.cluster.local:8000/v1/images/generations",
                data=req_data,
                headers={"Content-Type": "application/json"}
            )
            with urllib.request.urlopen(req, timeout=120) as resp:
                res = json.loads(resp.read().decode("utf-8"))
                item = res["data"][0]
                url = item["url"]
                img_id = item.get("image_id", "")
                dur = item.get("duration_seconds", 0)
                return f"![Photo générée]({url})\n\n*(Image ID: `{img_id}` générée en {dur}s - Vous pouvez demander une retouche ou un agrandissement 4K)*"
        except Exception as e:
            return f"Erreur lors de la génération de l'image : {str(e)}"

    @mcp.tool(
        name="edit_image",
        description="Modifie ou retouche une image précédemment générée en appliquant de nouvelles consignes (Image-to-Image / Inpainting). Utilise cet outil lorsque l'utilisateur demande d'ajuster ou modifier l'image."
    )
    def edit_image(prompt: str, parent_image_id: str = "", denoising_strength: float = 0.45) -> str:
        """Modifie une image existante avec de nouvelles consignes.
        
        Args:
            prompt: Modifications souhaitées décrites en anglais.
            parent_image_id: Nom du fichier ou identifiant de l'image parent (ex: jarvis_20261003_120401_abc123.png).
            denoising_strength: Force de modification entre 0.1 (subtil) et 0.8 (majeur). Défaut: 0.45.
        """
        try:
            payload = {"prompt": prompt, "denoising_strength": denoising_strength}
            if parent_image_id:
                payload["parent_image_id"] = parent_image_id
            req_data = json.dumps(payload).encode("utf-8")
            req = urllib.request.Request(
                "http://jarvis-image-gen.jarvis-system.svc.cluster.local:8000/v1/images/edits",
                data=req_data,
                headers={"Content-Type": "application/json"}
            )
            with urllib.request.urlopen(req, timeout=120) as resp:
                res = json.loads(resp.read().decode("utf-8"))
                item = res["data"][0]
                url = item["url"]
                img_id = item.get("image_id", "")
                dur = item.get("duration_seconds", 0)
                return f"![Photo retouchée]({url})\n\n*(Image ID: `{img_id}` retouchée en {dur}s)*"
        except Exception as e:
            return f"Erreur lors de la retouche de l'image : {str(e)}"

    @mcp.tool(
        name="upscale_image",
        description="Agrandit une image en résolution Ultra-HD 4K avec super-résolution et netteté améliorée."
    )
    def upscale_image(image_id: str, scale: int = 2) -> str:
        """Agrandit une image en haute définition.
        
        Args:
            image_id: Identifiant de l'image (ex: jarvis_20261003_120401_abc123.png).
            scale: Facteur d'agrandissement (2 ou 4). Défaut: 2.
        """
        try:
            req_data = json.dumps({"image_id": image_id, "scale": scale}).encode("utf-8")
            req = urllib.request.Request(
                "http://jarvis-image-gen.jarvis-system.svc.cluster.local:8000/v1/images/upscale",
                data=req_data,
                headers={"Content-Type": "application/json"}
            )
            with urllib.request.urlopen(req, timeout=60) as resp:
                res = json.loads(resp.read().decode("utf-8"))
                item = res["data"][0]
                url = item["url"]
                res_str = item.get("resolution", "")
                return f"![Photo HD 4K]({url})\n\n*(Image agrandie en résolution {res_str})*"
        except Exception as e:
            return f"Erreur lors de l'agrandissement de l'image : {str(e)}"

    if __name__ == "__main__":
        app = mcp.streamable_http_app()
        uvicorn.run(app, host="0.0.0.0", port=8000)
