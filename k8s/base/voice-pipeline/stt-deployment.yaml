apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-voice-stt
  namespace: jarvis-system
  labels:
    app.kubernetes.io/name: faster-whisper
    app.kubernetes.io/component: speech-to-text
    app.kubernetes.io/part-of: jarvis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: faster-whisper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: faster-whisper
        app.kubernetes.io/component: speech-to-text
        app.kubernetes.io/part-of: jarvis
    spec:
      nodeSelector:
        accelerator: nvidia-gpu
      containers:
        - name: faster-whisper
          image: fedirz/faster-whisper-server:latest-cpu
          imagePullPolicy: IfNotPresent
          env:
            - name: WHISPER__MODEL
              value: "Systran/faster-whisper-medium"
            - name: WHISPER__INFERENCE_ENGINE
              value: "faster_whisper"
            - name: WHISPER__COMPUTE_TYPE
              value: "int8"
            - name: WHISPER__BEAM_SIZE
              value: "5"
            - name: UVICORN_HOST
              value: "0.0.0.0"
            - name: UVICORN_PORT
              value: "8000"
            - name: HF_HOME
              value: "/root/.cache/huggingface"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          volumeMounts:
            - name: voice-storage
              mountPath: /root/.cache/huggingface
              subPath: whisper-models
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: voice-storage
          persistentVolumeClaim:
            claimName: jarvis-voice-cache-pvc
