apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-voice-tts
  namespace: jarvis-system
  labels:
    app.kubernetes.io/name: kokoro-tts
    app.kubernetes.io/component: text-to-speech
    app.kubernetes.io/part-of: jarvis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kokoro-tts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kokoro-tts
        app.kubernetes.io/component: text-to-speech
        app.kubernetes.io/part-of: jarvis
    spec:
      nodeSelector:
        accelerator: nvidia-gpu
      containers:
        - name: kokoro-tts
          image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2
          imagePullPolicy: IfNotPresent
          env:
            - name: USE_GPU
              value: "false"
            - name: DEFAULT_VOICE
              value: "bm_george"
            - name: PORT
              value: "8880"
          ports:
            - name: http
              containerPort: 8880
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: voice-storage
              mountPath: /app/api/src/voices
              subPath: tts-voices
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: voice-storage
          persistentVolumeClaim:
            claimName: jarvis-voice-cache-pvc
