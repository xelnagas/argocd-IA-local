apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-ingestor-script
  namespace: jarvis-system
  labels:
    app.kubernetes.io/name: jarvis-ingestor
    app.kubernetes.io/component: second-brain
    app.kubernetes.io/part-of: jarvis
data:
  ingest.py: |
    import os
    import sys
    import json
    import time
    import hashlib
    import urllib.request
    import urllib.error

    OLLAMA_URL = os.environ.get("OLLAMA_URL", "http://jarvis-inference.jarvis-system.svc.cluster.local:11434")
    QDRANT_URL = os.environ.get("QDRANT_URL", "http://jarvis-qdrant.jarvis-system.svc.cluster.local:6333")
    COLLECTION_NAME = os.environ.get("COLLECTION_NAME", "jarvis_second_brain")
    EMBED_MODEL = os.environ.get("EMBED_MODEL", "nomic-embed-text")
    NOTES_DIR = os.environ.get("NOTES_DIR", "/data/notes")
    STATE_FILE = os.path.join(NOTES_DIR, ".jarvis_index_state.json")
    SCAN_INTERVAL = int(os.environ.get("SCAN_INTERVAL", "300"))

    def log(msg):
        print(f"[JARVIS-INGESTOR] {time.strftime('%Y-%m-%d %H:%M:%S')} - {msg}", flush=True)

    def http_request(url, method="GET", data=None):
        headers = {"Content-Type": "application/json"}
        req_data = json.dumps(data).encode("utf-8") if data else None
        req = urllib.request.Request(url, data=req_data, headers=headers, method=method)
        try:
            with urllib.request.urlopen(req, timeout=30) as response:
                if response.status in (200, 201):
                    body = response.read().decode("utf-8")
                    return json.loads(body) if body else {}
        except urllib.error.HTTPError as e:
            err_body = e.read().decode("utf-8")
            return {"error": e.code, "detail": err_body}
        except Exception as e:
            return {"error": str(e)}
        return {}

    def ensure_qdrant_collection():
        log(f"Vérification de la collection Qdrant '{COLLECTION_NAME}'...")
        res = http_request(f"{QDRANT_URL}/collections/{COLLECTION_NAME}")
        if "error" in res or res.get("status") != "ok":
            log(f"Création de la collection '{COLLECTION_NAME}' (dimension 768 / Cosine)...")
            payload = {
                "vectors": {
                    "size": 768,
                    "distance": "Cosine"
                }
            }
            create_res = http_request(f"{QDRANT_URL}/collections/{COLLECTION_NAME}", method="PUT", data=payload)
            log(f"Résultat création collection : {create_res}")
        else:
            log(f"Collection '{COLLECTION_NAME}' prête.")

    def get_embedding(text):
        payload = {"model": EMBED_MODEL, "prompt": text}
        res = http_request(f"{OLLAMA_URL}/api/embeddings", method="POST", data=payload)
        if "embedding" in res:
            return res["embedding"]
        return None

    def chunk_text(content, max_chars=800, overlap=150):
        paragraphs = content.split("\n\n")
        chunks = []
        current = ""
        for p in paragraphs:
            p = p.strip()
            if not p:
                continue
            if len(current) + len(p) <= max_chars:
                current += ("\n\n" if current else "") + p
            else:
                if current:
                    chunks.append(current)
                current = p
        if current:
            chunks.append(current)
        return chunks

    def load_state():
        if os.path.exists(STATE_FILE):
            try:
                with open(STATE_FILE, "r", encoding="utf-8") as f:
                    return json.load(f)
            except Exception:
                pass
        return {}

    def save_state(state):
        try:
            with open(STATE_FILE, "w", encoding="utf-8") as f:
                json.dump(state, f, indent=2)
        except Exception as e:
            log(f"Erreur sauvegarde d'état : {e}")

    def index_vault():
        if not os.path.exists(NOTES_DIR):
            os.makedirs(NOTES_DIR, exist_ok=True)
            log(f"Création du répertoire de notes : {NOTES_DIR}")

        state = load_state()
        indexed_count = 0

        for root, dirs, files in os.walk(NOTES_DIR):
            for file in files:
                if not file.endswith((".md", ".txt", ".yaml", ".json")) or file.startswith("."):
                    continue
                filepath = os.path.join(root, file)
                rel_path = os.path.relpath(filepath, NOTES_DIR)

                try:
                    with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                        content = f.read()
                except Exception as e:
                    log(f"Impossible de lire {filepath} : {e}")
                    continue

                file_hash = hashlib.md5(content.encode("utf-8")).hexdigest()
                if state.get(rel_path) == file_hash:
                    continue  # Fichier inchangé

                log(f"Indexation sémantique du fichier : {rel_path}...")
                chunks = chunk_text(content)
                points = []

                for idx, chunk in enumerate(chunks):
                    emb = get_embedding(chunk)
                    if not emb:
                        log(f"Échec embedding pour le chunk {idx} de {rel_path}")
                        continue

                    # Générer un UUID déterministe par chunk
                    point_id = hashlib.md5(f"{rel_path}_{idx}".encode("utf-8")).hexdigest()
                    # Qdrant accepte les entiers ou UUID valides
                    # Conversion en UUID standard 8-4-4-4-12
                    uuid_str = f"{point_id[:8]}-{point_id[8:12]}-{point_id[12:16]}-{point_id[16:20]}-{point_id[20:32]}"

                    points.append({
                        "id": uuid_str,
                        "vector": emb,
                        "payload": {
                            "source": rel_path,
                            "filename": file,
                            "chunk_index": idx,
                            "content": chunk,
                            "timestamp": time.time()
                        }
                    })

                if points:
                    upsert_res = http_request(
                        f"{QDRANT_URL}/collections/{COLLECTION_NAME}/points?wait=true",
                        method="PUT",
                        data={"points": points}
                    )
                    indexed_count += 1
                    state[rel_path] = file_hash

        save_state(state)
        if indexed_count > 0:
            log(f"Indexation achevée : {indexed_count} document(s) injecté(s) dans le Second Cerveau.")

    def main():
        log("Démarrage du service d'ingestion J.A.R.V.I.S. Second Brain...")
        # Attente des services
        while True:
            try:
                urllib.request.urlopen(f"{QDRANT_URL}/readyz", timeout=5)
                urllib.request.urlopen(f"{OLLAMA_URL}/api/tags", timeout=5)
                break
            except Exception:
                log("En attente de Qdrant et Ollama...")
                time.sleep(5)

        ensure_qdrant_collection()

        while True:
            try:
                index_vault()
            except Exception as e:
                log(f"Erreur durant l'indexation : {e}")
            time.sleep(SCAN_INTERVAL)

    if __name__ == "__main__":
        main()
