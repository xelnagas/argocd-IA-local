apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jarvis-notes-pvc
  namespace: jarvis-system
  labels:
    app.kubernetes.io/name: notes-storage
    app.kubernetes.io/component: second-brain
    app.kubernetes.io/part-of: jarvis
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
