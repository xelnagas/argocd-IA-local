apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jarvis-qdrant-pvc
  namespace: jarvis-system
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: vector-database
    app.kubernetes.io/part-of: jarvis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
