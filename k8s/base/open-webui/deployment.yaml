apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-webui
  namespace: jarvis-system
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: jarvis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: jarvis
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_BASE_URL
              value: "http://jarvis-inference.jarvis-system.svc.cluster.local:11434"
            - name: WEBUI_AUTH
              value: "false"
            - name: WEBUI_NAME
              value: "Jarvis AI"
            - name: DEFAULT_MODELS
              value: "gemma2:9b"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "200m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: webui-storage
              mountPath: /app/backend/data
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: webui-storage
          persistentVolumeClaim:
            claimName: open-webui-pvc
