apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-webui-init-script
  namespace: jarvis-system
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: jarvis
data:
  init-audio.py: |
    import sqlite3
    import json
    import time
    import os

    db_path = '/app/backend/data/webui.db'
    # Attendre que la base SQLite soit créée par Open WebUI
    for _ in range(60):
        if os.path.exists(db_path):
            break
        time.sleep(2)

    time.sleep(3)

    try:
        conn = sqlite3.connect(db_path)
        c = conn.cursor()
        t = int(time.time())
        configs = [
            ('audio.tts.voice', json.dumps('ff_siwis')),
            ('audio.tts.engine', json.dumps('openai')),
            ('audio.tts.model', json.dumps('kokoro')),
            ('audio.tts.openai.api_base_url', json.dumps('http://jarvis-voice-tts.jarvis-system.svc.cluster.local:8880/v1')),
            ('audio.tts.openai.api_key', json.dumps('jarvis-audio-key')),
            ('audio.stt.engine', json.dumps('openai')),
            ('audio.stt.model', json.dumps('Systran/faster-whisper-medium')),
            ('audio.stt.openai.api_base_url', json.dumps('http://jarvis-voice-stt.jarvis-system.svc.cluster.local:8000/v1')),
            ('audio.stt.openai.api_key', json.dumps('jarvis-audio-key')),
            ('image_generation.enable', json.dumps(True)),
            ('image_generation.engine', json.dumps('openai')),
            ('image_generation.openai.api_base_url', json.dumps('http://jarvis-image-gen.jarvis-system.svc.cluster.local:8000/v1')),
            ('image_generation.openai.api_key', json.dumps('jarvis-image-key')),
            ('image_generation.model', json.dumps('SG161222/RealVisXL_V4.0_Lightning')),
            ('image_generation.size', json.dumps('1024x1024')),
            ('image_generation.steps', json.dumps(6)),
            ('images.edit.enable', json.dumps(True)),
            ('images.edit.engine', json.dumps('openai')),
            ('images.edit.openai.api_base_url', json.dumps('http://jarvis-image-gen.jarvis-system.svc.cluster.local:8000/v1')),
            ('images.edit.openai.api_key', json.dumps('jarvis-image-key')),
            ('images.edit.model', json.dumps('SG161222/RealVisXL_V4.0_Lightning')),
            ('images.edit.size', json.dumps('1024x1024')),
            ('image.enabled', json.dumps(True)),
            ('image.engine', json.dumps('openai')),
            ('image.openai.api_base_url', json.dumps('http://jarvis-image-gen.jarvis-system.svc.cluster.local:8000/v1')),
            ('image.openai.api_key', json.dumps('jarvis-image-key')),
            ('image.model', json.dumps('SG161222/RealVisXL_V4.0_Lightning')),
            ('image.size', json.dumps('1024x1024')),
            ('image.steps', json.dumps(6)),
            ('ui.default_models', json.dumps('jarvis:latest'))
        ]
        for k, v in configs:
            c.execute('INSERT OR REPLACE INTO config ("key", value, updated_at) VALUES (?, ?, ?)', (k, v, t))

        # Assurer que les utilisateurs existants ont également la voix par défaut initialisée
        c.execute('SELECT id, settings FROM user')
        for uid, s_str in c.fetchall():
            try:
                s = json.loads(s_str) if s_str else {}
                if 'ui' in s and 'audio' in s['ui'] and 'tts' in s['ui']['audio']:
                    s['ui']['audio']['tts']['voice'] = 'ff_siwis'
                    s['ui']['audio']['tts']['defaultVoice'] = 'ff_siwis'
                    # Désactiver explicitement browser-kokoro qui ne supporte que l'anglais dans le navigateur
                    if s['ui']['audio']['tts'].get('engine') in ['browser-kokoro', 'kokoro']:
                        s['ui']['audio']['tts']['engine'] = ''
                if 'audio' not in s:
                    s['audio'] = {}
                s['audio']['tts'] = {'voice': 'ff_siwis'}
                c.execute('UPDATE user SET settings = ? WHERE id = ?', (json.dumps(s), uid))
            except Exception:
                pass

        # Initialiser l'outil Workspace Jarvis Studio Visuel
        tool_content = '''        """
        title: Jarvis Studio Visuel
        author: Jarvis
        description: Génération et retouche d'images photoréalistes en haute résolution sur GPU local
        version: 1.0.0
        """

        import requests
        import json

        class Tools:
            def __init__(self):
                pass

            def generate_image(self, prompt: str) -> str:
                """
                Génère une image photoréaliste ou artistique via le Studio Visuel GPU local.
                :param prompt: Description photographique détaillée en anglais (cadrage, lumière, sujet, style 85mm photo).
                :return: Le lien Markdown de l'image générée.
                """
                try:
                    res = requests.post(
                        "http://jarvis-image-gen.jarvis-system.svc.cluster.local:8000/v1/images/generations",
                        json={"prompt": prompt, "steps": 6, "guidance_scale": 2.0},
                        timeout=120
                    )
                    data = res.json()
                    item = data["data"][0]
                    url = item["url"]
                    img_id = item.get("image_id", "")
                    dur = item.get("duration_seconds", 0)
                    if "svc.cluster.local" in url:
                        url = f"http://jarvis.local/images/{img_id}"
                    return f"![Image générée]({url})\\n\\n*(Image `{img_id}` générée en {dur}s)*"
                except Exception as e:
                    return f"Erreur génération d'image: {e}"

            def edit_image(self, prompt: str, parent_image_id: str = "") -> str:
                """
                Retouche ou modifie une image existante.
                :param prompt: Consignes des modifications souhaitées en anglais.
                :param parent_image_id: Identifiant de l'image précédente.
                :return: Le lien Markdown de l'image retouchée.
                """
                try:
                    payload = {"prompt": prompt, "denoising_strength": 0.45, "steps": 6, "guidance_scale": 2.0}
                    if parent_image_id:
                        payload["parent_image_id"] = parent_image_id
                    res = requests.post(
                        "http://jarvis-image-gen.jarvis-system.svc.cluster.local:8000/v1/images/edits",
                        json=payload,
                        timeout=120
                    )
                    data = res.json()
                    item = data["data"][0]
                    url = item["url"]
                    img_id = item.get("image_id", "")
                    dur = item.get("duration_seconds", 0)
                    if "svc.cluster.local" in url:
                        url = f"http://jarvis.local/images/{img_id}"
                    return f"![Image retouchée]({url})\\n\\n*(Image `{img_id}` retouchée en {dur}s)*"
                except Exception as e:
                    return f"Erreur retouche d'image: {e}"
        '''
        tool_specs = json.dumps([
            {
                "name": "edit_image",
                "description": "Retouche ou modifie une image existante.",
                "parameters": {
                    "properties": {
                        "prompt": {"description": "Consignes des modifications souhaitées en anglais.", "type": "string"},
                        "parent_image_id": {"default": "", "description": "Identifiant de l'image précédente.", "type": "string"}
                    },
                    "required": ["prompt"],
                    "type": "object"
                }
            },
            {
                "name": "generate_image",
                "description": "Génère une image photoréaliste ou artistique via le Studio Visuel GPU local.",
                "parameters": {
                    "properties": {
                        "prompt": {"description": "Description photographique détaillée en anglais (cadrage, lumière, sujet, style 85mm photo).", "type": "string"}
                    },
                    "required": ["prompt"],
                    "type": "object"
                }
            }
        ])
        tool_meta = json.dumps({
            "description": "Génération et retouche d'images photoréalistes sur GPU local",
            "manifest": {
                "title": "Jarvis Studio Visuel",
                "author": "Jarvis",
                "description": "Génération et retouche d'images photoréalistes en haute résolution sur GPU local",
                "version": "1.0.0"
            },
            "has_user_valves": False
        })

        c.execute('SELECT id FROM user LIMIT 1')
        urow = c.fetchone()
        admin_uid = urow[0] if urow else 'admin'

        c.execute('SELECT id FROM tool WHERE id = "jarvis_image_studio"')
        if not c.fetchone():
            c.execute('''
                INSERT INTO tool (id, user_id, name, content, specs, meta, valves, updated_at, created_at)
                VALUES (?, ?, ?, ?, ?, ?, '{}', ?, ?)
            ''', ('jarvis_image_studio', admin_uid, 'Jarvis Studio Visuel', tool_content, tool_specs, tool_meta, t, t))

        # Initialiser les capacités et outils pour les modèles
        for mid, mname in [('jarvis:latest', 'Jarvis (Assistant Principal)'), ('maxwellb/Qwen3.5-35B-A3B-Base:latest', 'Qwen 3.5 35B A3B Base')]:
            mmeta = json.dumps({
                'toolIds': ['jarvis_image_studio'],
                'capabilities': {'vision': True, 'image_generation': True, 'web_search': True}
            })
            c.execute('SELECT id FROM model WHERE id = ?', (mid,))
            if c.fetchone():
                c.execute('UPDATE model SET meta = ?, updated_at = ? WHERE id = ?', (mmeta, t, mid))
            else:
                c.execute('''
                    INSERT INTO model (id, user_id, base_model_id, name, params, meta, updated_at, created_at, is_active)
                    VALUES (?, ?, NULL, ?, '{}', ?, ?, ?, 1)
                ''', (mid, admin_uid, mname, mmeta, t, t))

        conn.commit()
        conn.close()
        print("WebUI SQLite audio, studio tool and models successfully initialized.")
    except Exception as e:
        print("WebUI SQLite audio initialization error:", e)
