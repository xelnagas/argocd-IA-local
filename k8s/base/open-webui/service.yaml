apiVersion: v1
kind: Service
metadata:
  name: jarvis-webui
  namespace: jarvis-system
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: jarvis
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
  selector:
    app.kubernetes.io/name: open-webui
