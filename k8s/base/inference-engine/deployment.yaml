apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-inference
  namespace: jarvis-system
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/component: inference-engine
    app.kubernetes.io/part-of: jarvis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/component: inference-engine
        app.kubernetes.io/part-of: jarvis
    spec:
      nodeSelector:
        accelerator: nvidia-gpu
        gpu-model: rtx2070super
      runtimeClassName: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MODELS
              value: "/root/.ollama/models"
            - name: OLLAMA_KEEP_ALIVE
              value: "24h"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
          ports:
            - name: http
              containerPort: 11434
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 14Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models-storage
              mountPath: /root/.ollama
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    (
                      sleep 5
                      until ollama list > /dev/null 2>&1; do sleep 2; done
                      ollama pull gemma2:9b
                    ) > /dev/null 2>&1 &
          startupProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: models-storage
          persistentVolumeClaim:
            claimName: ollama-models-pvc
